  STATE.auth.wis = { date: iso(addDays(TODAY,1)), lec:'s7-e1',
    q:'You do not manage time. You allocate attention — and you have been doing it all day without once deciding to.',
    src:'The Discipline of Attention — Session 1',
    exp:'Time passes at the same rate for everyone, which is why managing it is not the lever people think it is. Attention is the lever, and unlike time it can be divided, fragmented and spent without noticing. Eight hours of divided attention is not eight hours of work; it is a great many minutes of starting.',
    refl:'Count your interruptions for one hour today. Just count them.', audio:138 };
  renderShell();
}
function authPublishWisdom(){
  const d = STATE.auth.wis;
  if (!d.q.trim() || !d.refl.trim()){ toast('A Daily Wisdom needs a passage and a question.','warn'); return; }
  const id = 'w'+(WISDOM.length+1);
  const rec = { id, date:d.date, q:d.q.trim(), src:d.src||'Mind & Intellect', exp:d.exp,
    audio:d.audio, refl:d.refl, lec:d.lec||null, cat:'Mind', fresh:true };
  if (d.date <= iso(TODAY)) WISDOM.unshift(rec); else WISDOM.push(rec);
  WISDOM.sort((a,b)=> a.date<b.date?1:-1);
  audit('Daily Wisdom scheduled', id+' — '+fmtDate(d.date),
    'delivery 06:30 member-local; linked session: '+(d.lec||'none')+'; audio '+clock(d.audio)+
    '; estimated reach '+nfmt(Math.round(analytics().total*0.68)));
  STATE.auth.wis = { q:'', src:'', exp:'', refl:'', lec:'', date: iso(addDays(TODAY,2)), audio:140 };
  toast('Scheduled for '+fmtDate(d.date)+' at 06:30, member-local, honouring quiet hours.','','Daily Wisdom queued');
  renderShell();
}

/* Names the elements whose right edge passes the viewport, so a layout
   overflow is reported as a fact rather than found by squinting. */
function overflowers(){
  const w = document.documentElement.clientWidth, out = [];
  try{
    document.querySelectorAll('body *').forEach(el=>{
      const r = el.getBoundingClientRect();
      if (r.width && r.right > w + 1 && r.width <= w * 3){
        /* Content inside a scroll container is meant to be wider than the box */
        for (let a = el.parentElement; a && a !== document.body; a = a.parentElement){
          const ox = getComputedStyle(a).overflowX;
          if (ox === 'auto' || ox === 'scroll' || ox === 'hidden') return;
        }
        const par = el.parentElement;
        if (par && par.getBoundingClientRect().right > w + 1) return; /* report the outermost only */
        out.push((el.id? '#'+el.id : '.'+(el.className||'?').toString().split(' ')[0]) + '@' + Math.round(r.right));
      }
    });
  }catch(e){ return ['probe-failed']; }
  return out.slice(0,6);
}

/* ---------- Boot ---------- */
function boot(){
  const q = new URLSearchParams(location.search);
  const s = q.get('s');
  STATE.surface = ['launch','app','web','admin','ds'].indexOf(s)>=0 ? s : 'launch';
  VIZMODE = STATE.surface==='admin' ? 'light' : 'dark';
  if (q.get('page')) STATE.admin.page = q.get('page');
  /* the console starts signed in for demo links, except the login route itself */
  STATE.adminAuthed = q.get('page') !== 'login';
  if (q.get('role')) { const rr = ROLES.find(r=>r.id===q.get('role')); if (rr){ ADMIN_USER.roleId=rr.id; ADMIN_USER.role=rr.name; } }
  /* ?plan=wisdom|plus opens straight into an entitled member's view — used for
     demo links and by the render sweep, so a paywall does not stand in the way. */
  const pl = q.get('plan');
  if (pl && planById(pl)){ ME.plan = pl; ME.status = 'Active'; ME.renewal = iso(addDays(TODAY,30)); }
  const scr = q.get('screen');
  if (scr){ STATE.authed = ['splash','onb','interests','auth'].indexOf(scr)<0; STATE.screen = scr; STATE.arg = q.get('id')||null;
    if (['home','discover','journey','daily','you'].indexOf(scr)>=0) STATE.tab = scr; }
  else { STATE.screen = 'splash'; }
  renderShell();
  if (STATE.surface==='app' && STATE.screen==='player' && STATE.arg){ openPlayer(STATE.arg); }
  window.__READY = true;
  /* Probe: proves the trap is installed and reports its count into the DOM,
     so a headless sweep can assert on rendered state rather than source text. */
  try{
    const pr = document.getElementById('__probe');
    if (pr) pr.textContent = 'READY|' + STATE.surface + '|' +
      (STATE.surface==='admin' ? STATE.admin.page : STATE.screen) +
      '|errs=' + (Array.isArray(window.__ERRS) ? window.__ERRS.length : 'NOTRAP') +
      '|nodes=' + document.querySelectorAll('#stage *').length +
      '|vw=' + window.innerWidth + '|scroll=' + document.documentElement.scrollWidth +
      '|wide=' + overflowers().join(' ');
  }catch(e){}
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
